services:
  n-ops-main-api:
    image: neko7nik/n-ops-main-api:latest
    container_name: n-ops-main-api

    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

    environment:
      # Logging and Runtime
      - ENABLE_LOGGING=True
      - RUST_LOG=rust_api=TRACE
      - API_WORKERS_COUNT=4

      # PostgreSQL Database
      - POSTGRES_DB_URL=postgres://user:password@db.nekonik.com:5432/nekonik
      - PG_CONN_TIMEOUT=<PG_CONN_TIMEOUT>
      - PG_POOL_MAX_SIZE=<PG_POOL_MAX_SIZE>
      - PG_POOL_WAIT_TIMEOUT=<PG_POOL_WAIT_TIMEOUT>
      - PG_POOL_NEW_CONNECTION_TIMEOUT=<PG_POOL_NEW_CONNECTION_TIMEOUT>
      - PG_POOL_RECYCLE_TIMEOUT=<PG_POOL_RECYCLE_TIMEOUT>
      - PG_POOL_WARM_POOL=<PG_POOL_WARM_POOL>
      - PG_POOL_WARM_POOL_SIZE=<PG_POOL_WARM_POOL_SIZE>
      # SSL (PostgreSQL Secure Sockets Layer Configuration)
      - PG_SSL_ACCEPT_INVALID_CERTS=<PG_SSL_ACCEPT_INVALID_CERTS>
      - PG_SSL_ACCEPT_INVALID_HOSTNAMES=<PG_SSL_ACCEPT_INVALID_HOSTNAMES>
      - PG_SSL_ROOT_CERT_PATH=<PG_SSL_ROOT_CERT_PATH>

      # In-Memory Cache (Moka)
      - CACHE_SIZE=1000
      - CACHE_EXPIRATION_TIME=300

      # Redis Configuration
      - REDIS_URL=redis://rust-api-redis:6379

      # CloudFlare Turnstile Configuration
      - CLOUDFLARE_TURNSTILE_API_URL=<CLOUDFLARE_TURNSTILE_API_URL>
      - CLOUDFLARE_TURNSTILE_SECRET_KEY=<CLOUDFLARE_TURNSTILE_SECRET_KEY>

      # RMQ Message Queue
      - RABBITMQ_DOMAIN=<RABBITMQ_DOMAIN>
      - RABBITMQ_USER_NAME=<RABBITMQ_USER_NAME>
      - RABBITMQ_PASSWORD=<RABBITMQ_PASSWORD>
      - RABBITMQ_VIRTUAL_HOST=<RABBITMQ_VIRTUAL_HOST>
      - RABBITMQ_EXCHANGE_NAME=amq.default
      - RABBITMQ_MAILBOX_MANAGER_QUEUE=<RABBITMQ_MAILBOX_MANAGER_QUEUE>

      # SMTP Email Configuration
      - SMTP_HOST=<SMTP_HOST>
      - SMTP_FROM_EMAIL="No-Reply <no-reply@email.com>"
      - SMTP_USER_NAME=<SMTP_USER_NAME>
      - SMTP_PASSWORD=<SMTP_PASSWORD>
      - SMTP_PORT=<SMTP_PORT>
      - SMTP_USE_TLS=<SMTP_USE_TLS>

      # OTP (One-Time Password) Configuration
      - OTP_CHARSET=<OTP_CHARSET>
      - OTP_HASH_SECRET=<OTP_HASH_SECRET, generate using 'openssl rand -hex 32'>

      # Self API Configuration
      - ALLOWED_ORIGINS=<ALLOWED_ORIGINS_LIST>
      - SELF_API_KEY=<SELF_API_KEY>

    volumes:
      - /ca.crt:/ca.crt:ro

    networks:
      - nik-api-network

    ports:
      - "127.0.0.1:8686:8686"

    restart: always


networks:
  nik-api-network:
    external: true
