services:
  n-ops-redis:
    image: redis:8
    container_name: n-ops-redis

    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

    networks:
      - n-ops-network

    restart: always
  
  n-ops-pgsql:
    image: postgres:18
    container_name: n-ops-pgsql

    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

    environment:
      POSTGRES_USER: nops
      POSTGRES_PASSWORD: nops.app
      POSTGRES_DB: n_ops
    
    volumes:
      - /data/n-ops/pgsql-db:/var/lib/postgresql

    networks:
      - n-ops-network

    # ports:  # If you want to expose PostgreSQL to external connections
    #   - 5432:5432

    restart: always

networks:
  n-ops-network:
    external: true

# Do : docker network create n-ops-network
